; PlatformIO project configuration
; Builds the same firmware as the Arduino IDE, but fully from the command line:
;   pio run                 - build firmware (default env: nano)
;   pio run -e uno          - build for Arduino Uno variant
;   pio run -t upload       - flash via USB
;   pio run -t clean        - clean build artifacts
;
; Install once with: pip install -U platformio  (or: pipx install platformio)

[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
board_build.f_cpu = 16000000L
monitor_speed = 57600
lib_deps =
	pu2clr/PU2CLR SI4735@^2.1.8
	datacute/Tiny4kOLED@^2.3.0
	datacute/TinyOLED-Fonts@^1.2.0

; Arduino Nano, ATmega328P, OLD bootloader (most ATS-20 units)
[env:nano]
board = nanoatmega328

; Arduino Nano, ATmega328P, NEW bootloader
[env:nano_new]
board = nanoatmega328new

; Arduino Uno, ATmega328P
[env:uno]
board = uno
