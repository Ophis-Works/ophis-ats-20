; PlatformIO project configuration
; Builds the firmware from the command line:
;   pio run                 - build firmware
;   pio run -e nano_twi -t upload       - flash via USB
;   pio run -t clean        - clean build artifacts
;

[platformio]
default_envs = nano_twi

[env]
platform = atmelavr
framework = arduino
board_build.f_cpu = 16000000L
monitor_speed = 57600
lib_deps =
	pu2clr/PU2CLR SI4735@^2.1.8
	datacute/Tiny4kOLED@^2.3.0
	datacute/TinyOLED-Fonts@^1.2.0

; Arduino Nano, ATmega328P, OLD bootloader (most ATS-20 units), with the
; minimal polling TWI master (lib/WireShim) instead of the stock Wire library
; (~2KB flash, ~100B RAM smaller). Made the only/default build env by user
; decision. For units with the NEW bootloader (e.g. ATS-20+), change board to nanoatmega328new.
[env:nano_twi_old]
board = nanoatmega328
lib_ignore = Wire

[env:nano_twi]
board = nanoatmega328new
lib_ignore = Wire

